name: Yayin

on:
  schedule:
    # Her 10 dakikada bir - 2026-09-17'de 15 dakikadan indirildi.
    # Sebep: 17 Eylul'de 20 firsattan yalnizca 1'i calisti. GitHub zamanlanmis isleri
    # yogun saatlerde atliyor, bu yuzden firsat sayisi artirildi (20 -> 30).
    # Pencere 15-19 UTC = 18:07-22:52 TR; Emrullah KARA'nin "18'den sonra" karari.
    - cron: "*/10 15-19 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: yayin
  cancel-in-progress: false

jobs:
  yayimla:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Sirasi geleni yayimla
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: node yayinla.mjs
      - name: Cizelgeyi kaydet
        run: |
          if [ -n "$(git status --porcelain cizelge.json)" ]; then
            git config user.name "sarmal-yayin"
            git config user.email "destek@sarmaldonusum.com.tr"
            git add cizelge.json
            git commit -m "yayin durumu guncellendi"
            git push
          else
            echo "degisiklik yok"
          fi
